[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsj-headline-trader"
version = "1.0.0"
description = "Trade the companies most featured in the last hour of WSJ headlines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
wsj-headline-trader = "wsj_headline_trader.cli:main"
wsj-headline-backtest = "wsj_headline_trader.backtest_cli:main"
wsj-headline-pine = "wsj_headline_trader.pine_cli:main"
wsj-headline-simulate = "wsj_headline_trader.simulate_cli:main"

[tool.setuptools]
packages = ["wsj_headline_trader"]

[tool.setuptools.package-data]
wsj_headline_trader = ["data/*.json"]
